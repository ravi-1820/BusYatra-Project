{% extends 'base.html' %}
{% load static %}
{% block content %}
<!-- Main Content -->
<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="auth-card">
        {% if msg %}
        <div class="alert alert-danger" role="alert">
            {{msg}}
        </div>
        {% endif %}
        <div class="auth-header text-center">
            <h4 class="text-navy-dark mb-1">Forgot Password</h4>
            <p class="text-muted small">Enter your email address to receive an OTP</p>
        </div>

        <form method="POST" action="{% url 'forgot_password' %}">
            {% csrf_token %}
            <!-- Email Field -->
            <div class="mb-4">
                <label for="email" class="form-label fw-semibold text-secondary small">Email Address</label>
                <div class="input-group-custom">
                    <i class="bi bi-envelope text-muted"></i>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-custom w-100 py-2.5 fs-6 mb-3">
                Send OTP
            </button>

            <!-- Back to Login -->
            <div class="text-center">
                <a href="{% url 'login' %}" class="text-muted text-decoration-none small">
                    <i class="bi bi-arrow-left"></i> Back to Login
                </a>
            </div>
        </form>
    </div>
</main>
{% endblock %}
