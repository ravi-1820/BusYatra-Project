{% extends 'base.html' %}
{% load static %}
{% block content %}
<!-- Main Content -->
<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="auth-card">
        {% if msg %}
        <div class="alert alert-danger" role="alert">
            {{msg}}
        </div>
        {% endif %}
        <div class="auth-header">
            <a href="{% url 'index' %}" class="auth-logo d-flex align-items-center justify-content-center">
                <img src="{% static 'assets/images/logo.png' %}" alt="BusYatra Logo" height="60">
            </a>
            <h4 class="text-navy-dark mt-2 mb-1">Reset Password</h4>
            <p class="text-muted small">Enter your new password</p>
        </div>

        <form method="POST" action="{% url 'reset_password' %}">
            {% csrf_token %}
            <!-- Password Field -->
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold text-secondary small">New Password</label>
                <div class="input-group-custom">
                    <i class="bi bi-lock text-muted"></i>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter new password" required>
                </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="mb-4">
                <label for="confirm_password" class="form-label fw-semibold text-secondary small">Confirm New Password</label>
                <div class="input-group-custom">
                    <i class="bi bi-lock-fill text-muted"></i>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-custom w-100 py-2.5 fs-6 mb-3">
                Reset Password
            </button>
        </form>
    </div>
</main>
{% endblock %}
