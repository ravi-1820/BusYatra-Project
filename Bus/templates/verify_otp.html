{% extends 'base.html' %}
{% load static %}
{% block content %}

<!-- Main Content -->
<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="auth-card">

        {% if msg %}
        <div class="alert alert-danger" role="alert">
            {{ msg }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success" role="alert">
            {{ success }}
        </div>
        {% endif %}

        <div class="auth-header">
            <a href="{% url 'index' %}" class="auth-logo d-flex align-items-center justify-content-center">
                <img src="{% static 'assets/images/logo.png' %}" alt="BusYatra Logo" height="60">
            </a>

            <h4 class="text-navy-dark mt-2 mb-1">
                Verify OTP
            </h4>

            <p class="text-muted small">
                Enter the 6-digit OTP sent to your registered email.
            </p>
        </div>

        <form method="POST" action="{% url 'verify_otp' %}">
            {% csrf_token %}

            <!-- OTP -->
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small">
                    Enter OTP
                </label>

                <div class="input-group-custom">
                    <i class="bi bi-shield-lock text-muted"></i>

                    <input
                        type="text"
                        class="form-control"
                        name="otp"
                        maxlength="6"
                        placeholder="Enter 6-digit OTP"
                        required>
                </div>
            </div>

            <!-- Verify Button -->
            <button type="submit" class="btn btn-primary-custom w-100 py-2.5 fs-6 mb-3">
                Verify OTP
            </button>

            <!-- Back -->
            <div class="text-center">
                <a href="{% url 'login' %}" class="text-muted text-decoration-none small">
                    <i class="bi bi-arrow-left"></i>
                    Back to Login
                </a>
            </div>

        </form>

    </div>
</main>

{% endblock %}
