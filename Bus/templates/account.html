{% extends 'base.html' %}
{% load static %}
{% block content %}
<!-- Main Content Container -->
<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="account-profile-card">
        <!-- Title -->
        <h4 class="account-card-title">Update your account</h4>

        <!-- Alert Message Container -->
        <div id="alertContainer"></div>

        {% if msg %}
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}

        <form method="POST" action="{% url 'account' %}" id="account" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="account-profile-layout">
                <!-- Left Column: Circular Avatar (~130px) -->
                <div class="account-avatar-col">
                    <div class="account-avatar-wrapper position-relative" style="width: 100px !important; height: 100px !important; border-radius: 50% !important; background-color: #EFF6FF !important; position: relative !important; margin: 0 auto 0.65rem auto !important;">
                        {% if user.profile and user.profile.name %}
                            <img src="{{ user.profile.url }}" id="avatarPreview" alt="Profile Picture" class="account-avatar-img clickable-avatar" onclick="openFullScreenAvatar();" title="Click to view full screen" style="width: 100px !important; height: 100px !important; max-width: 100px !important; max-height: 100px !important; border-radius: 50% !important; object-fit: cover !important; object-position: center !important; display: block !important;">
                            <div id="avatarFallback" class="account-avatar-fallback" onclick="openFullScreenAvatar();" style="width: 100px !important; height: 100px !important; border-radius: 50% !important; display: none !important; align-items: center !important; justify-content: center !important;">
                                <i class="bi bi-person-fill" style="font-size: 2.5rem; color: #3B82F6;"></i>
                            </div>
                        {% else %}
                            <img src="" id="avatarPreview" alt="Profile Picture" class="account-avatar-img clickable-avatar" onclick="openFullScreenAvatar();" title="Click to view full screen" style="width: 100px !important; height: 100px !important; max-width: 100px !important; max-height: 100px !important; border-radius: 50% !important; object-fit: cover !important; object-position: center !important; display: none !important;">
                            <div id="avatarFallback" class="account-avatar-fallback" style="width: 100px !important; height: 100px !important; border-radius: 50% !important; display: flex !important; align-items: center !important; justify-content: center !important;">
                                <i class="bi bi-person-fill" style="font-size: 2.5rem; color: #3B82F6;"></i>
                            </div>
                        {% endif %}
                        <button type="button" class="account-avatar-edit-btn" onclick="document.getElementById('profile').click();" title="Change Profile Picture" aria-label="Change profile picture" style="position: absolute !important; bottom: 0px !important; right: 0px !important; width: 30px !important; height: 30px !important; border-radius: 50% !important; z-index: 10 !important; padding: 0 !important; display: flex !important; align-items: center !important; justify-content: center !important;">
                            <i class="bi bi-camera-fill"></i>
                        </button>
                    </div>
                    <input type="file" id="profile" name="profile" class="d-none" accept="image/*">
                    <span class="account-avatar-label">Profile picture</span>
                </div>

                <!-- Right Column: Form Fields -->
                <div class="account-fields-col">
                    <!-- Full Name Field -->
                    <div class="account-field-group">
                        <label for="fullName" class="account-field-label">Full name</label>
                        <div class="account-input-container">
                            <i class="bi bi-person"></i>
                            <input type="text" class="form-control" id="fullName" name="name" value="{{ user.name }}" required>
                        </div>
                    </div>

                    <!-- Email Address Field -->
                    <div class="account-field-group">
                        <label for="email" class="account-field-label">Email address</label>
                        <div class="account-input-container">
                            <i class="bi bi-envelope"></i>
                            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" readonly required>
                        </div>
                    </div>

                    <!-- Phone Number Field -->
                    <div class="account-field-group">
                        <label for="phoneNumber" class="account-field-label">Phone number</label>
                        <div class="account-input-container">
                            <i class="bi bi-telephone"></i>
                            <input type="tel" class="form-control" id="phoneNumber" name="mobile" value="{{ user.phone }}" required>
                        </div>
                    </div>

                    <!-- Horizontal Divider -->
                    <hr class="account-divider">

                    <!-- Terms and Conditions Checkbox -->
                    <div class="account-field-group">
                        <div class="form-check account-terms-check d-flex align-items-center gap-2 m-0 ps-4">
                            <input type="checkbox" class="form-check-input mt-0" id="termsCheck" required>
                            <label class="form-check-label account-terms-text" for="termsCheck">
                                I agree to the <a href="#">terms of service and privacy policy</a>
                            </label>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="account-actions-group">
                        <button type="submit" class="btn btn-update-account" id="signUpBtn">
                            <span class="spinner-border spinner-border-sm me-2 d-none" id="loadingSpinner" role="status" aria-hidden="true"></span>
                            <span id="btnText">Update account</span>
                        </button>
                        <a href="{% url 'delete_account' %}" class="btn btn-delete-account-ghost" onclick="return confirm('Are you sure you want to delete your account? This action cannot be undone.');">
                            Delete account
                        </a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</main>

<!-- Fullscreen Profile Image View Modal -->
<div class="modal fade" id="profileImageModal" tabindex="-1" aria-labelledby="profileImageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-dark bg-opacity-90 border-0 rounded-4 shadow-lg overflow-hidden">
            <div class="modal-header border-0 pb-0 justify-content-end px-3 pt-3">
                <button type="button" class="btn-close btn-close-white p-2" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4 text-center d-flex justify-content-center align-items-center">
                <img src="" id="fullScreenAvatarImg" class="img-fluid rounded-circle shadow-lg" style="max-height: 75vh; max-width: 100%; object-fit: cover;" alt="Full Screen Profile Image">
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('profile').addEventListener('change', function (e) {
        if (e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function (evt) {
                const preview = document.getElementById('avatarPreview');
                const fallback = document.getElementById('avatarFallback');
                preview.src = evt.target.result;
                preview.style.setProperty('display', 'block', 'important');
                if (fallback) {
                    fallback.style.setProperty('display', 'none', 'important');
                }
            }
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    function openFullScreenAvatar() {
        const preview = document.getElementById('avatarPreview');
        if (preview && preview.src && preview.style.display !== 'none' && !preview.classList.contains('d-none') && preview.src !== window.location.href && !preview.src.endsWith('#')) {
            document.getElementById('fullScreenAvatarImg').src = preview.src;
            const modal = new bootstrap.Modal(document.getElementById('profileImageModal'));
            modal.show();
        }
    }
</script>
{% endblock %}
