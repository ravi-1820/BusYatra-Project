{% extends 'base.html' %}
{% load static %}
{% block content %}
<!-- Main Content -->
<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="auth-card" style="max-width: 500px;">
        <div class="auth-header text-center">
            <h4 class="text-navy-dark mb-1">Update your Account</h4>
        </div>

        <!-- Alert Message Container -->
        <div id="alertContainer"></div>

        <form method="POST" action="{% url 'account' %}" id="account" enctype="multipart/form-data">
            {% csrf_token %}
            <!-- <div class="col-md-12">
                <div class="form-floating">
                    <select class="form-select" id="usertype" name="usertype" aria-label="Usertype">
                        <option value="usertype" hidden>---Usertype---</option>
                        <option value="customer">Customer</option>
                        <option value="manager">Manager</option>
                        <option value="admin">Admin</option>
                    </select>
                    <label for="usertype">Usertype</label>
                </div>
            </div> -->

            <!-- Full Name Field -->
            <div class="mb-3">
                <label for="fullName" class="form-label fw-semibold text-secondary small">Full Name</label>
                <div class="input-group-custom">
                    <i class="bi bi-person text-muted"></i>
                    <input type="text" class="form-control" id="fullName" name="name" value="{{ user.name }}" required>
                </div>
            </div>

            <!-- Email Field -->
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold text-secondary small">Email Address</label>
                <div class="input-group-custom">
                    <i class="bi bi-envelope text-muted"></i>
                    <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" readonly
                        required>
                </div>
            </div>

            <!-- Phone Number Field -->
            <div class="mb-3">
                <label for="phoneNumber" class="form-label fw-semibold text-secondary small">Phone Number</label>
                <div class="input-group-custom">
                    <i class="bi bi-phone text-muted"></i>
                    <input type="tel" class="form-control" id="phoneNumber" name="mobile" value="{{ user.phone }}"
                        required>
                </div>
            </div>

            <img src="{{ user.profile.url }}" style="height: 100px; width: 100px;">
            <!-- profile Field -->
            <div class="mb-3">
                <label for="profile" class="form-label fw-semibold text-secondary small">Profile Picture</label>
                <div class="input-group-custom">
                    <i class="bi bi-person text-muted"></i>
                    <input type="file" class="form-control" id="profile" name="profile">
                </div>
            </div>

            <!-- Terms and Conditions Checkbox -->
            <div class="mb-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="termsCheck" required>
                    <label class="form-check-label text-muted small" for="termsCheck">
                        I agree to the <a href="#" class="text-primary text-decoration-none">Terms of Service</a> & <a
                            href="#" class="text-primary text-decoration-none">Privacy Policy</a>
                    </label>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-3 mb-3">
                <button type="submit" class="btn btn-primary-custom flex-grow-1 py-2.5 fs-6" id="signUpBtn">
                    <span class="spinner-border spinner-border-sm me-2 d-none" id="loadingSpinner" role="status"
                        aria-hidden="true"></span>
                    <span id="btnText">Update Account</span>
                </button>
                <a href="{% url 'delete_account' %}" class="btn btn-danger btn-danger-custom flex-grow-1 py-2.5 fs-6 d-flex align-items-center justify-content-center text-white" onclick="return confirm('Are you sure you want to delete your account? This action cannot be undone.');">
                    Delete Account
                </a>
            </div>
        </form>



        <!-- <div class="text-center mt-4">
            <a href="{% url 'index' %}" class="text-muted text-decoration-none small"><i
                    class="bi bi-arrow-left me-1"></i> Back to Homepage</a>
        </div> -->
    </div>
</main>

<!-- Footer Section -->
{% endblock %}
